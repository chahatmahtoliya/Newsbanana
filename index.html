    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=Cormorant+Garamond:wght@400;600;700&family=DM+Mono:wght@400;500&family=DM+Serif+Display&family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;600;700&family=Libre+Baskerville:wght@400;700&family=Lora:wght@400;600;700&family=Merriweather:wght@400;700;900&family=Newsreader:opsz,wght@6..72,400;6..72,700&family=Noto+Serif+Display:wght@400;600;700&family=Prata&family=Roboto+Mono:wght@400;600;700&family=Space+Mono:wght@400;700&family=Young+Serif&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

    <link rel="stylesheet" href="/index.css">
    <style>
      :root {
        color-scheme: light dark;
        --font-albert-sans: "Albert Sans", ui-sans-serif, system-ui, sans-serif;
        --paper: #FAF9F5;
        --paper-deep: #F4F0E8;
        --surface: #FFFFFF;
        --surface-soft: #F4F0E8;
        --fill: #EAE4D6;
        --ink: #141413;
        --ink-soft: #524E48;
        --ink-muted: #7A756D;
        --ink-faint: #B5ADA1;
        --line: #E5DFD1;
        --line-soft: #EFEAE0;
        --accent: #E11D48;
        --accent-bright: #F43F5E;
        --shadow-bedo: 0 1px 2px rgba(0,0,0,0.05), 0 4px 12px -2px rgba(0,0,0,0.08), 0 16px 40px -12px rgba(0,0,0,0.12);
      }
      .dark, html.dark {
        color-scheme: dark;
        --paper: #0B0B0D;
        --paper-deep: #121216;
        --surface: #131317;
        --surface-soft: #181820;
        --fill: #1E1E26;
        --ink: #F4F4F5;
        --ink-soft: #B9BCC2;
        --ink-muted: #8A8E96;
        --ink-faint: #3F3F48;
        --line: #27272E;
        --line-soft: #1C1C22;
        --accent: #EF4444;
        --accent-bright: #F87171;
        --shadow-bedo: 0 1px 2px rgba(0,0,0,0.4), 0 4px 12px -2px rgba(0,0,0,0.5), 0 16px 40px -12px rgba(0,0,0,0.6);
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 5rem;
      }
      body {
        background-color: var(--paper);
        color: var(--ink);
        font-family: var(--font-albert-sans), 'Albert Sans', 'Manrope', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .site-title {
        letter-spacing: -0.035em;
        text-wrap: balance;
        font-size: clamp(2.25rem, 6vw, 3.75rem);
        font-weight: 700;
        line-height: 1.08;
      }
      .section-title {
        letter-spacing: -0.025em;
        font-size: clamp(1.75rem, 3.6vw, 2.5rem);
        font-weight: 700;
        line-height: 1.15;
      }
      .btn {
        white-space: nowrap;
        cursor: pointer;
        border-radius: 9999px;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
        height: 2.75rem;
        padding: 0 1.25rem;
        font-size: 0.9375rem;
        font-weight: 600;
        line-height: 1;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        display: inline-flex;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn-primary {
        background: var(--ink);
        color: var(--paper);
        box-shadow: 0 1px 2px rgba(0,0,0,0.1), 0 4px 12px rgba(0,0,0,0.08);
      }
      .btn-primary:hover {
        opacity: 0.92;
        transform: translateY(-1px);
      }
      .btn-light {
        background: var(--surface);
        color: var(--ink);
        box-shadow: inset 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,0.04);
      }
      .btn-light:hover {
        background: var(--surface-soft);
      }
      .strip {
        scrollbar-width: none;
        padding-left: max(1rem, 50% - 176px);
        padding-right: 2rem;
        scroll-padding-left: max(1rem, 50% - 176px);
      }
      @media (min-width: 768px) {
        .strip {
          padding-left: max(1rem, 50% - 352px);
          padding-right: 4rem;
          scroll-padding-left: max(1rem, 50% - 352px);
        }
      }
      .strip::-webkit-scrollbar {
        display: none;
      }
      @keyframes rise {
        0% { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: none; }
      }
      .rise {
        animation: 0.6s cubic-bezier(0.22, 1, 0.36, 1) both rise;
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        .rise {
          animation: none;
        }
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--paper);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--ink-muted);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
